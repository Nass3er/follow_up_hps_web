<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج العينات - HPS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1565c0 0%, #1e88e5 100%);
            --table-header: #f1f8fe;
        }

        body {
            background-color: #f0f4f8;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding-bottom: 30px;
        }

        .header-section {
            background: var(--primary-gradient);
            color: white;
            padding: 15px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 20px rgba(21, 101, 192, 0.25);
            text-align: center;
            position: relative;
            margin-bottom: 15px;
        }

        .btn-back {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            font-size: 24px;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-back:hover {
            transform: translateY(-50%) scale(1.2) translateX(3px);
        }

        .container {
            max-width: 900px;
            margin: 15px auto;
            padding: 0 12px;
        }

        .patient-info {
            background: white;
            border-radius: 15px;
            padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info-box {
            background: #f8fbff;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #e3f2fd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .info-label {
            color: #78909c;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .info-value {
            color: #1565c0;
            font-weight: bold;
            font-size: 13px;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-section {
            background: white;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            overflow: hidden;
            border: 1px solid #e3f2fd;
        }

        .doc-header {
            background: #e3f2fd;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #1565c0;
            border-bottom: 2px solid #bbdefb;
            font-size: 14px;
        }

        .doc-header span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .doc-content {
            padding: 0;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        th {
            background: var(--table-header);
            color: #1565c0;
            font-weight: 700;
            white-space: nowrap;
        }

        td {
            color: #37474f;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f9fbff;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: #1565c0;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #78909c;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Custom Styles for Search Button and Modal */
        #btn-search-results {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(21, 101, 192, 0.15);
            transition: all 0.2s ease;
            font-family: 'Tajawal', sans-serif;
            text-decoration: none;
        }

        #btn-search-results:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 15px rgba(21, 101, 192, 0.25);
        }

        #btn-search-results:active:not(:disabled) {
            transform: translateY(0) scale(1);
        }

        #btn-search-results:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Modal Styles matching patient-dashboard */
        .modal-content {
            border-radius: 25px !important;
            padding: 0 !important;
            overflow: hidden;
            border: none;
        }

        .modal-header {
            background: #f8fbff;
            padding: 20px !important;
            border-bottom: 1px solid #e3f2fd !important;
        }

        .search-box-container {
            padding: 15px;
            background: white;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e3f2fd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        .search-input:focus {
            border-color: #1565c0;
        }

        .adm-table-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .modern-table {
            width: 100%;
            border-collapse: collapse;
        }

        .modern-table th {
            background: #f1f8fe;
            padding: 15px;
            text-align: right;
            font-size: 14px;
            color: #1565c0;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .modern-table td {
            padding: 15px;
            border-bottom: 1px solid #f1f8fe;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }

        .modern-table tr:hover {
            background: #f9fbff;
        }

        /* Modal specific table styling - smaller font to fit columns */
        .modal .modern-table td {
            font-weight: 500;
            font-size: 11px;
            padding: 8px 6px;
        }

        .modal .modern-table th {
            font-size: 11px;
            padding: 8px 6px;
        }

        .close-btn {
            font-size: 28px;
            cursor: pointer;
            color: #78909c;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #e74c3c;
        }

        /* Better mobile optimizations for tables */
        @media (max-width: 480px) {
            .patient-info {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .info-box {
                padding: 8px 12px;
            }
            th, td {
                padding: 8px 6px;
                font-size: 12px;
            }
            .header-section {
                padding: 12px 15px;
                margin-bottom: 10px;
            }
            .header-section h1 {
                font-size: 18px !important;
            }
            #btn-search-results {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <header class="header-section">
        <a href="patient-dashboard.html" class="btn-back" title="رجوع">➡</a>
        <h1 style="margin:0; font-size: 22px; font-weight: 700;">نتائج العينات</h1>
    </header>

    <div class="container">
        <div class="patient-info" id="patient-info-container" style="display: none;">
            <div class="info-box">
                <span class="info-label">رقم الترقيد</span>
                <span class="info-value" id="lbl-adm-no"></span>
            </div>
            <div class="info-box">
                <span class="info-label">المريض</span>
                <span class="info-value" id="lbl-patient"></span>
            </div>
        </div>

        <!-- زر البحث واختيار النتائج المعتمدة -->
        <div id="search-action-container" style="display: none; margin: 10px 0; text-align: center;">
            <button id="btn-search-results" onclick="openResultsModal()" disabled>
                <span>🔍</span>
                <span>البحث عن نتيجة فحص</span>
            </button>
        </div>

        <div id="results-container">
            <div class="loader" id="loader">جاري تحميل النتائج...</div>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="modal-results" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <div style="display:flex; justify-content: space-between; align-items: center; width: 100%;">
                    <h3 style="margin:0;">قائمة نتائج العينات المعتمدة</h3>
                    <span class="close-btn" onclick="closeModal('modal-results')">&times;</span>
                </div>
            </div>
            <div class="search-box-container">
                <input type="text" id="result-search-input" class="search-input" placeholder="البحث برقم النتيجة، الطبيب، أو التاريخ..." onkeyup="filterResults()">
            </div>
            <div class="adm-table-container">
                <table id="result-list-table" class="modern-table">
                    <thead>
                        <tr>
                            <th>رقم النتيجة</th>
                            <th>اسم الخدمة (الفحص)</th>
                            <th>تاريخ النتيجة</th>
                            <th>اسم المريض</th>
                            <th>اسم الطبيب</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows populated by JS -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal('modal-results')" class="btn btn-secondary" style="font-family:'Tajawal', sans-serif;">إغلاق</button>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/db.js"></script>
    <script>
        let ALL_LAB_RESULTS = [];

        document.addEventListener('DOMContentLoaded', () => {
            const savedPatient = localStorage.getItem('selected_patient');
            if (!savedPatient) {
                alert("لم يتم تحديد مريض!");
                window.location.href = 'patient-dashboard.html';
                return;
            }

            const patient = JSON.parse(savedPatient);
            document.getElementById('patient-info-container').style.display = 'grid';
            document.getElementById('search-action-container').style.display = 'block';
            document.getElementById('lbl-adm-no').innerText = patient.docNo;
            document.getElementById('lbl-patient').innerText = `${patient.patientNo} - ${patient.patientName}`;

            loadLabResults(patient.docSerial || patient.docSrl);
        });

        async function loadLabResults(admissionDocSrl) {
            const container = document.getElementById('results-container');
            const searchBtn = document.getElementById('btn-search-results');
            const cacheKey = `lab_results_${admissionDocSrl}`;
            try {
                let data = null;
                let isOffline = false;

                try {
                    const response = await fetch(`${getBaseApiUrl()}/LabResult/by-admission?admissionDocSrl=${admissionDocSrl}`, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({})
                    });

                    if (response.ok) {
                        data = await response.json();
                        // Cache locally in IndexedDB
                        await saveToDB('lab_results_history', { cacheKey, results: data || [] }, false);
                    } else {
                        throw new Error("HTTP Status " + response.status);
                    }
                } catch(netErr) {
                    console.warn("Fetch lab results failed, looking in local DB...", netErr);
                    const cached = await getFromDB('lab_results_history', cacheKey);
                    if (cached) {
                        data = cached.results;
                        isOffline = true;
                    } else {
                        throw netErr; // bubble up if no local cache
                    }
                }

                ALL_LAB_RESULTS = data || [];

                if (ALL_LAB_RESULTS.length === 0) {
                    container.innerHTML = `<div class="empty-state">لا توجد نتائج عينات معتمدة لهذا الترقيد.</div>`;
                    searchBtn.disabled = true;
                } else {
                    searchBtn.disabled = false;
                    container.innerHTML = `
                        <div class="empty-state" style="padding: 50px 20px;">
                            <div style="font-size: 55px; margin-bottom: 20px; opacity: 0.8;">🔬</div>
                            <h3 style="color: #1565c0; margin-bottom: 10px;">تم تحميل النتائج المعتمدة (${ALL_LAB_RESULTS.length})</h3>
                            <p style="color: #78909c;">يرجى الضغط على زر البحث في الأعلى لاختيار نتيجة فحص وعرض تفاصيلها.</p>
                        </div>
                    `;
                    if (isOffline) {
                        window.appAlert("⚠️ تعذر الاتصال بالخادم، تم عرض نتائج العينات المحفوظة محلياً في وضع عدم الاتصال.", 'warning');
                    }
                }
            } catch (error) {
                console.error('Error fetching lab results:', error);
                container.innerHTML = `<div class="empty-state">تعذر الاتصال بالخادم ولم يتم العثور على نتائج محفوظة محلياً مسبقاً لهذا الترقيد.</div>`;
            }
        }

        // Search modal toggle logic
        function openResultsModal() {
            document.getElementById('modal-results').style.display = 'block';
            renderResultsTable(ALL_LAB_RESULTS);
            document.getElementById('result-search-input').value = '';
            document.getElementById('result-search-input').focus();
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function renderResultsTable(list) {
            const tbody = document.querySelector('#result-list-table tbody');
            tbody.innerHTML = '';

            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">لا توجد نتائج عينات</td></tr>';
                return;
            }

            const savedPatient = localStorage.getItem('selected_patient');
            const patient = savedPatient ? JSON.parse(savedPatient) : {};

            list.forEach(doc => {
                const tr = document.createElement('tr');
                const docNo = doc.docNo || doc.docSrl || '--';
                const docDate = doc.docDate || '';
                const patientName = patient.patientName || '--';
                const doctorName = doc.doctorName || doc.dctrName || patient.doctorName || '--';

                // Display only the main service/item name (like C.B.C) from the header, with fallback to first detail if empty
                const serviceName = (doc.details && doc.details[0] && doc.details[0].itemClassName) || doc.itemName || doc.serviceName || doc.docDsc || (doc.details && doc.details[0] && (doc.details[0].serviceName || doc.details[0].itemName)) || '--';

                tr.innerHTML = `
                    <td style="font-weight:bold; color:#1565c0;">${docNo}</td>
                    <td style="color:#2e7d32; font-weight:bold; white-space: normal; line-height: 1.3; max-width: 180px;">${serviceName}</td>
                    <td>${docDate}</td>
                    <td>${patientName}</td>
                    <td>${doctorName}</td>
                `;
                tr.onclick = () => selectResult(doc.docSrl);
                tbody.appendChild(tr);
            });
        }

        function selectResult(docSrl) {
            closeModal('modal-results');
            const selectedDoc = ALL_LAB_RESULTS.find(doc => doc.docSrl === docSrl);
            if (selectedDoc) {
                renderSelectedResult(selectedDoc);
            }
        }

        function filterResults() {
            const term = document.getElementById('result-search-input').value.toLowerCase();
            const savedPatient = localStorage.getItem('selected_patient');
            const patient = savedPatient ? JSON.parse(savedPatient) : {};

            const filtered = ALL_LAB_RESULTS.filter(doc => {
                const docNo = (doc.docNo || doc.docSrl || '').toString().toLowerCase();
                const docDate = (doc.docDate || '').toLowerCase();
                const patientName = (patient.patientName || '').toLowerCase();
                const doctorName = (doc.doctorName || doc.dctrName || patient.doctorName || '').toLowerCase();
                
                const serviceName = ((doc.details && doc.details[0] && doc.details[0].itemClassName) || doc.itemName || doc.serviceName || doc.docDsc || (doc.details && doc.details[0] && (doc.details[0].serviceName || doc.details[0].itemName)) || '').toLowerCase();

                return docNo.includes(term) || docDate.includes(term) || patientName.includes(term) || doctorName.includes(term) || serviceName.includes(term);
            });

            renderResultsTable(filtered);
        }

        function renderSelectedResult(doc) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            const docDiv = document.createElement('div');
            docDiv.className = 'doc-section';

            const header = document.createElement('div');
            header.className = 'doc-header';
            header.style.cursor = 'default';
            header.innerHTML = `
                <span>
                    <i style="font-size: 20px;">📄</i> 
                    تفاصيل النتيجة - فاتورة رقم: ${doc.docNo} 
                    <small style="color: #555; margin-right: 10px;">(${doc.docDate || ''})</small>
                </span>
            `;

            const content = document.createElement('div');
            content.className = 'doc-content active';
            content.id = `content-${doc.docSrl}`;

            let tableHtml = `
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>م</th>
                                <th>اسم الفحص</th>
                                <th>النتيجة</th>
                                <th>القيمة الطبيعية</th>
                                <th>الوحدة</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (doc.details && doc.details.length > 0) {
                doc.details.forEach(dtl => {
                    tableHtml += `
                        <tr>
                            <td>${dtl.tstCode || ''}</td>
                            <td>${dtl.itemName || dtl.itemCode || ''}</td>
                            <td style="font-weight: bold; color: #1565c0;">${dtl.result || ''}</td>
                            <td style="direction: ltr; text-align: right;">${dtl.normalValue || ''}</td>
                            <td>${dtl.unit || ''}</td>
                        </tr>
                    `;
                });
            } else {
                tableHtml += `<tr><td colspan="5" class="empty-state">لا توجد تفاصيل لهذه الفاتورة</td></tr>`;
            }

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;

            content.innerHTML = tableHtml;
            docDiv.appendChild(header);
            docDiv.appendChild(content);
            container.appendChild(docDiv);
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
            }
        }
    </script>
</body>
</html>
